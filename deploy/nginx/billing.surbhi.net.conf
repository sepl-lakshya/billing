# ============================================================================
# SEPL Billing — PRODUCTION   (billing.surbhi.net)
# Reverse-proxy the domain to the single Node process on 127.0.0.1:4000.
#
# Install:
#   sudo cp deploy/nginx/billing.surbhi.net.conf /etc/nginx/sites-available/billing.surbhi.net
#   sudo ln -sf /etc/nginx/sites-available/billing.surbhi.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt): after the port-80 block below is live, run:
#   sudo certbot --nginx -d billing.surbhi.net
# Certbot will add the 443 server block and the HTTP->HTTPS redirect for you.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name billing.surbhi.net;

    # Allow uploads a bit larger than MAX_UPLOAD_MB (30) for multipart overhead.
    client_max_body_size 60m;

    # API, uploads, and the SPA are all served by the Node process.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support (harmless if unused).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
